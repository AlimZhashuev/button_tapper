[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "vk_project"
version = "0.1.0"
description = "Backend service"
requires-python = "~=3.12"

dependencies = [
    "opencv-python>=4.9.0",
    "numpy>=1.26.0",
    "loguru>=0.7",
    "PyYAML>=6.0",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.0",

    "ruff>=0.6",
    "mypy>=1.11",

    "ipython>=8.0"
]


[tool.ruff]
line-length = 120
target-version = "py312"

exclude = [
    ".venv",
    "build",
    "dist"
]


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP"
]

[tool.mypy]
python_version = "3.12"

strict = true

ignore_missing_imports = true

exclude = [
    "tests"
]


[tool.pytest.ini_options]
asyncio_mode = "auto"

testpaths = [
    "tests"
]
